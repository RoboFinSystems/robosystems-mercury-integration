name: Run

# The default runtime: GitHub Actions as the scheduler + runner. Zero
# infrastructure — configure the repo secrets/vars below and the feed
# runs daily. Mercury deletes API tokens unused for 45 days, so a daily
# cron is also what keeps the token alive.
#
# Configuration (Settings → Secrets and variables → Actions):
#   secrets.ROBOSYSTEMS_API_KEY       — API key for the target graph
#   secrets.MERCURY_API_KEY           — Mercury read-only API token
#   vars.ROBOSYSTEMS_GRAPH_ID        — graph to write to (kg...)
#   vars.INTEGRATION_SOURCE_NAME     — source name (default: mercury)
#   vars.MERCURY_SINCE               — earliest transaction date (YYYY-MM-DD)
#   vars.ROBOSYSTEMS_API_URL         — optional; defaults to the managed cloud
#
# Notes: GitHub pauses cron workflows in public repos after 60 days
# without activity, and skews schedule start times — don't depend on
# minute-level precision.

on:
  schedule:
    - cron: '17 11 * * *' # daily ~11:17 UTC, after Mercury's overnight posting
  workflow_dispatch:

jobs:
  run:
    # No-op until the repo is configured (keeps the template itself quiet).
    if: vars.ROBOSYSTEMS_GRAPH_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv sync

      - name: Run integration
        env:
          ROBOSYSTEMS_API_URL: ${{ vars.ROBOSYSTEMS_API_URL || 'https://api.robosystems.ai' }}
          ROBOSYSTEMS_API_KEY: ${{ secrets.ROBOSYSTEMS_API_KEY }}
          ROBOSYSTEMS_GRAPH_ID: ${{ vars.ROBOSYSTEMS_GRAPH_ID }}
          INTEGRATION_SOURCE_NAME: ${{ vars.INTEGRATION_SOURCE_NAME || 'mercury' }}
          MERCURY_API_KEY: ${{ secrets.MERCURY_API_KEY }}
          MERCURY_SINCE: ${{ vars.MERCURY_SINCE || '2025-01-01' }}
        run: uv run python -m integration.main
