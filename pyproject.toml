[project]
name = "robosystems-mercury-integration"
version = "0.1.0"
description = "Mercury bank feed → RoboLedger, run with your own read-only Mercury API token"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "RFS LLC"},
]
license = {text = "MIT"}
dependencies = [
    "robosystems-client>=1,<2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.21.0",
    "pytest>=8.3.5",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integration"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
